name: Build Android APK 2.0

on:
  # Runs when you click "Run workflow" in the Actions tab
  workflow_dispatch:
  # Also runs automatically on push to main (optional)
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (API 34)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK 2.0
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # ^ if your module isn't called "app", change this path
